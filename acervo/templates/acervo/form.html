{% extends 'base.html' %}
{% block titulo %}Cadastrar/Editar Livro{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4">
                <h4 class="fw-bold mb-3">Dados do Livro</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Salvar Livro</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
