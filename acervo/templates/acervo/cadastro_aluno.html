{% extends 'base.html' %}
{% block titulo %}Cadastro de Aluno{% endblock %}
{% block conteudo %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <h4 class="fw-bold text-center mb-3">Cadastro de Leitor / Aluno</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 mt-2">Criar Conta</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
