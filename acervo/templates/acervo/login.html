{% extends 'base.html' %}
{% block titulo %}Entrar - Biblioteca{% endblock %}
{% block conteudo %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <h4 class="fw-bold text-center mb-3">Acesso ao Sistema</h4>
                <p class="text-muted small text-center mb-4">Entre com sua matrícula (aluno) ou usuário administrativo
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Matrícula ou Usuário</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Senha</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
                </form>
                <div class="text-center small">
                    Ainda não tem conta? <a href="{% url 'cadastro_aluno' %}">Cadastre sua matrícula</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
